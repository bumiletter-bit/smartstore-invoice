<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트스토어 → 송장 변환기</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        h1 {
            color: #1a1a2e;
            margin-bottom: 8px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 32px;
            font-size: 14px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 40px;
            width: 100%;
            max-width: 800px;
        }
        .sender-section {
            background: #f8f9ff;
            border: 1px solid #e0e4f0;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 28px;
        }
        .sender-section h3 {
            color: #1a1a2e;
            margin-bottom: 16px;
            font-size: 16px;
        }
        .form-row {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
        }
        .form-row:last-child { margin-bottom: 0; }
        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .form-group.full { flex: 2; }
        .form-group label {
            font-size: 13px;
            color: #555;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .form-group input {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4a6cf7;
            box-shadow: 0 0 0 3px rgba(74,108,247,0.1);
        }
        .upload-area {
            border: 2px dashed #c5cae9;
            border-radius: 12px;
            padding: 48px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 24px;
            background: #fafbff;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #4a6cf7;
            background: #f0f3ff;
        }
        .upload-area.has-file {
            border-color: #4caf50;
            background: #f1f8e9;
        }
        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .upload-text {
            color: #666;
            font-size: 15px;
        }
        .upload-text strong {
            color: #4a6cf7;
        }
        .file-name {
            color: #4caf50;
            font-weight: 600;
            font-size: 16px;
            margin-top: 8px;
        }
        #fileInput { display: none; }
        .btn {
            width: 100%;
            padding: 16px;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-convert {
            background: #4a6cf7;
            color: white;
        }
        .btn-convert:hover:not(:disabled) {
            background: #3a5ce5;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(74,108,247,0.3);
        }
        .btn-convert:disabled {
            background: #c5cae9;
            cursor: not-allowed;
        }
        .preview-section {
            margin-top: 28px;
        }
        .preview-section h3 {
            color: #1a1a2e;
            margin-bottom: 12px;
            font-size: 16px;
        }
        .stats {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
        }
        .stat-card {
            flex: 1;
            background: #f8f9ff;
            border-radius: 10px;
            padding: 16px;
            text-align: center;
        }
        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
            color: #4a6cf7;
        }
        .stat-card .label {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }
        .table-wrapper {
            overflow-x: auto;
            border: 1px solid #e8e8e8;
            border-radius: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            white-space: nowrap;
        }
        th {
            background: #4a6cf7;
            color: white;
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        td {
            padding: 8px 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        tr:hover td {
            background: #f8f9ff;
        }
        .success-msg {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 16px;
            border-radius: 10px;
            margin-top: 16px;
            text-align: center;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>
    <h1>스마트스토어 → 송장 변환기</h1>
    <p class="subtitle">스마트스토어 발주 엑셀을 업로드하면 송장 양식으로 변환합니다</p>

    <div class="container">
        <div class="sender-section">
            <h3>출고지 정보</h3>
            <div class="form-row">
                <div class="form-group full">
                    <label>출고지 주소</label>
                    <input type="text" id="senderAddress" value="제주특별자치도 제주시 연삼로 1066-31, 제주아꼼이네">
                </div>
            </div>
            <p style="font-size:12px; color:#888; margin-top:8px;">* 보내는사람 = 구매자명(제주아꼼이네) / 보내는사람연락처 = 구매자연락처 (자동 변환)</p>
        </div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📄</div>
            <div class="upload-text">
                스마트스토어 엑셀 파일(B)을 여기에 <strong>드래그</strong>하거나 <strong>클릭</strong>하여 업로드
            </div>
            <div class="file-name" id="fileName"></div>
        </div>
        <input type="file" id="fileInput" accept=".xlsx,.xls">

        <button class="btn btn-convert" id="convertBtn" disabled>변환 및 다운로드</button>

        <div class="success-msg" id="successMsg">송장 엑셀 파일이 성공적으로 다운로드되었습니다!</div>

        <div class="preview-section" id="previewSection" style="display:none;">
            <h3>미리보기</h3>
            <div class="stats">
                <div class="stat-card">
                    <div class="number" id="totalOrders">0</div>
                    <div class="label">총 주문 건수</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="totalQty">0</div>
                    <div class="label">총 수량</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="uniqueRecipients">0</div>
                    <div class="label">수취인 수</div>
                </div>
            </div>
            <div class="table-wrapper" id="tableWrapper"></div>
        </div>
    </div>

    <script>
        let parsedData = null;

        // DOM elements
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const convertBtn = document.getElementById('convertBtn');
        const previewSection = document.getElementById('previewSection');
        const successMsg = document.getElementById('successMsg');

        // Upload area events
        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFile(e.dataTransfer.files[0]);
            }
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            fileName.textContent = file.name;
            uploadArea.classList.add('has-file');
            successMsg.style.display = 'none';

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const workbook = XLSX.read(e.target.result, { type: 'array' });
                    const sheetName = workbook.SheetNames[0];
                    const sheet = workbook.Sheets[sheetName];

                    // B파일은 2행이 헤더 (1행은 안내문)
                    const rawData = XLSX.utils.sheet_to_json(sheet, { range: 1, defval: '' });
                    parsedData = rawData;

                    if (parsedData.length > 0) {
                        convertBtn.disabled = false;
                        showPreview(parsedData);
                    } else {
                        alert('데이터가 없습니다. 올바른 스마트스토어 엑셀 파일인지 확인해주세요.');
                    }
                } catch (err) {
                    alert('파일을 읽는 중 오류가 발생했습니다: ' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function showPreview(data) {
            previewSection.style.display = 'block';

            // Stats
            document.getElementById('totalOrders').textContent = data.length;
            const totalQty = data.reduce((sum, row) => sum + (parseInt(row['수량']) || 1), 0);
            document.getElementById('totalQty').textContent = totalQty;
            const recipients = new Set(data.map(r => r['수취인명']));
            document.getElementById('uniqueRecipients').textContent = recipients.size;

            // Table - show converted format preview
            const converted = convertData(data);
            const headers = ['보내는사람', '보내는사람연락처', '수취인명', '옵션정보', '수량', '배송지'];
            let html = '<table><thead><tr>';
            headers.forEach(h => html += `<th>${h}</th>`);
            html += '</tr></thead><tbody>';

            const previewRows = converted.slice(0, 10);
            previewRows.forEach(row => {
                html += '<tr>';
                headers.forEach(h => {
                    let val = row[h] || '';
                    if (typeof val === 'string' && val.length > 30) val = val.substring(0, 30) + '...';
                    html += `<td>${val}</td>`;
                });
                html += '</tr>';
            });
            if (converted.length > 10) {
                html += `<tr><td colspan="${headers.length}" style="text-align:center;color:#999;padding:12px;">... 외 ${converted.length - 10}건 더</td></tr>`;
            }
            html += '</tbody></table>';
            document.getElementById('tableWrapper').innerHTML = html;
        }

        // 한글/영문 사이즈 표현 → 영문 대문자 변환
        function detectSize(msg) {
            if (!msg) return null;
            const lower = msg.toLowerCase().trim();

            // 한글 사이즈 매핑 (투에스 > 에스 순서 중요)
            const koreanMap = [
                { patterns: ['투에스', '2에스'], size: '2S' },
                { patterns: ['에스', '스몰'], size: 'S' },
                { patterns: ['엠', '미디엄', '미듐'], size: 'M' },
            ];

            for (const item of koreanMap) {
                for (const p of item.patterns) {
                    if (lower.includes(p)) return item.size;
                }
            }

            // 영문+사이즈: "2s사이즈", "s 사이즈", "m사이즈"
            let match = lower.match(/(2s|s|m)\s*사이즈/);
            if (match) return match[1].toUpperCase();

            // 영문 단독: "2s", "s", "m"
            match = lower.match(/\b(2s)\b/) || lower.match(/\b([sm])\b/);
            if (match) return match[1].toUpperCase();

            return null;
        }

        function convertData(data) {
            const senderAddress = document.getElementById('senderAddress').value.trim();

            return data.map(row => {
                const buyerName = (row['구매자명'] || '').trim();
                let optionInfo = (row['옵션정보'] || '').replace(/아꼼이네\s*.*?상품선택\s*:\s*\d+\.\s*(\(제철\)\s*)?/g, '').replace(/\(★행사\)\s*/g, '').replace(/★?추천\s*선물세트\s*\/\s*상품\s*및\s*과수\s*:\s*/g, '').trim();
                const msg = (row['배송메세지'] || '').trim();

                // 3종세트 상품: ★추천 선물세트 접두사 추가
                if (optionInfo.includes('3종세트') && !optionInfo.includes('/ 상품 및 과수:')) {
                    optionInfo = '★추천 선물세트 / 상품 및 과수: ' + optionInfo;
                }

                // 선물용 상품 변환
                if (optionInfo.includes('/ 상품 및 과수:')) {
                    // "/ 상품 및 과수:" 뒤가 "프리미엄 선물용"이면 앞부분도 통일
                    const parts = optionInfo.split(/\/\s*상품\s*및\s*과수\s*:\s*/);
                    if (parts[1] && parts[1].trim().startsWith('프리미엄 선물용')) {
                        optionInfo = '프리미엄 선물용 / 상품 및 과수: ' + parts[1].trim();
                    }
                } else if (optionInfo.includes('선물용')) {
                    // 단독 선물용 상품 (예: 선물용 천혜향 - 2kg)
                    if (!optionInfo.startsWith('프리미엄')) {
                        optionInfo = '프리미엄 ' + optionInfo;
                    }
                    optionInfo = '프리미엄 선물용 / 상품 및 과수: ' + optionInfo;
                }

                // 배송메세지에서 사이즈 요청 감지
                const detectedSize = detectSize(msg);
                if (detectedSize) {
                    optionInfo = optionInfo.trim() + ' ' + detectedSize + '사이즈로!';
                }

                return {
                    '보내는사람': buyerName ? buyerName + '(제주아꼼이네)' : '',
                    '보내는사람연락처': (row['구매자연락처'] || '').includes('*') ? '010-6687-4031' : (row['구매자연락처'] || ''),
                    '출고지': senderAddress,
                    '수취인명': row['수취인명'] || '',
                    '옵션정보': optionInfo,
                    '수량': parseInt(row['수량']) || 1,
                    '수취인연락처1': row['수취인연락처1'] || '',
                    '수취인연락처2': row['수취인연락처2'] || '',
                    '배송지': row['통합배송지'] || '',
                    '배송메세지': row['배송메세지'] || '',
                    '구매자연락처': row['구매자연락처'] || ''
                };
            });
        }

        // Convert button
        convertBtn.addEventListener('click', () => {
            if (!parsedData) return;

            const converted = convertData(parsedData);

            // Create workbook matching a.xlsx Sheet1 format
            const wb = XLSX.utils.book_new();

            // Sheet1 - 송장 양식
            const ws = XLSX.utils.json_to_sheet(converted, {
                header: ['보내는사람', '보내는사람연락처', '출고지', '수취인명', '옵션정보', '수량', '수취인연락처1', '수취인연락처2', '배송지', '배송메세지', '구매자연락처']
            });

            // Set column widths
            ws['!cols'] = [
                { wch: 22 }, // 보내는사람
                { wch: 16 }, // 보내는사람연락처
                { wch: 40 }, // 출고지
                { wch: 10 }, // 수취인명
                { wch: 40 }, // 옵션정보
                { wch: 6 },  // 수량
                { wch: 16 }, // 수취인연락처1
                { wch: 16 }, // 수취인연락처2
                { wch: 45 }, // 배송지
                { wch: 25 }, // 배송메세지
                { wch: 16 }, // 구매자연락처 (K열)
            ];

            XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');

            // Download
            const today = new Date();
            const dateStr = today.getFullYear() +
                String(today.getMonth() + 1).padStart(2, '0') +
                String(today.getDate()).padStart(2, '0');
            XLSX.writeFile(wb, `송장_${dateStr}.xlsx`);

            successMsg.style.display = 'block';
        });
    </script>
</body>
</html>
